name: CI

# Valida que el sitio carga y funciona. No hay build: solo se sirven los
# archivos tal cual y se prueban con Node y el Chrome que trae el runner.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sintaxis de los archivos JS
        run: |
          for f in *.js examples/*.js tests/*.js tests/*.mjs tests/lib/*.mjs tests/fixtures/*.js tools/*.mjs; do
            node --check "$f"
          done

      - name: Pruebas unitarias
        run: node tests/run-node.mjs

      - name: Sitio completo (config, archivos, .mind, enlaces)
        run: node tests/check-site.mjs

      - name: Pruebas de punta a punta (Chrome con cámara simulada)
        run: node tests/e2e.mjs
